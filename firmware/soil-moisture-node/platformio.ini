[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; This board enumerates as COM4 (confirmed via Device Manager) -- the
; same port the DHT22 node used, since only one board is plugged in at a
; time on this machine. If you ever run both boards simultaneously, or
; move this one to a different USB port, check Device Manager > Ports
; (COM & LPT) and update this if `pio run --target upload` ever says the
; port is busy or doesn't exist.
upload_port = COM4
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
