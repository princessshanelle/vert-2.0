[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
upload_port = COM3
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_Xian_ESP32S3
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
