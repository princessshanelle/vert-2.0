[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Same machine, same one-board-at-a-time habit as the other nodes: COM4
; is whichever ESP32 is plugged in. Check Device Manager > Ports (COM &
; LPT) and update this if `pio run --target upload` says the port is
; busy or doesn't exist.
upload_port = COM4
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
