[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; The board's CP2102 chip enumerates as COM4 on this machine (confirmed
; via Device Manager after installing the Silicon Labs driver -- COM3 is
; a different, unrelated board's leftover entry). If you ever move this
; board to a different USB port or computer, Windows may assign a
; different number -- check Device Manager > Ports (COM & LPT) and
; update this if `pio run --target upload` ever says the port is busy
; or doesn't exist again.
upload_port = COM4
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
