; VERT greenhouse controller: one ESP32 DevKit V1 (30-pin, DOIT) running the
; DHT22, soil moisture probes, pH probe, pump relay and grow-light relay as
; five VERT devices. See README.md for wiring, provisioning and calibration.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; upload_port is detected automatically. If you have several boards plugged
; in, set it: e.g. COM4 (Windows), /dev/cu.usbserial-0001 (Mac), /dev/ttyUSB0 (Linux).
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
