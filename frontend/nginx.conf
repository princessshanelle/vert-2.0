# WebSocket upgrades pass "Upgrade"; ordinary requests close normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses the History API (real-looking paths like
    # /devices/cam01, not /#/devices/cam01), which only exist client-side
    # -- nginx has no file at that path. Without this fallback, anything
    # but the exact root URL 404s on a hard refresh, a bookmark, or a
    # link shared with someone else, even though clicking to that same
    # page from within the app works perfectly (the router handles that
    # in-browser and never asks nginx for it).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dashboard talks to its APIs on the same address it was loaded
    # from, and nginx forwards each call to the right service. Without
    # this the built app called http://localhost:8080 -- which only works
    # on the Docker machine itself, and which Chrome blocks outright for a
    # page opened by LAN IP (Local Network Access). Same-origin calls work
    # from localhost, the LAN IP, or a phone, with no IP baked in anywhere.
    #
    # Docker's own DNS (127.0.0.11) plus variables makes nginx look the
    # service names up per request, so nginx still starts -- and recovers
    # -- if a backend container is down or restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;
    set $automation http://automation:8081;
    set $minio http://minio:9000;

    # Automation's two route groups; everything else under /api is the gateway.
    location ~ ^/api/v1/(rules|alerts)(/|$) {
        proxy_pass $automation;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # /api/v1/ws/readings is a WebSocket (live chart updates).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 6m; # CSV exports and the like; frames go to :8080 directly
    }

    # Camera photos. The gateway signs each photo link for the address the
    # browser used (VERT_S3_PUBLIC_ENDPOINT=request); passing that same
    # Host through to MinIO is what makes the signature check out. The
    # path must match VERT_S3_BUCKET in docker-compose.yml.
    location /vert-frames/ {
        proxy_pass $minio;
        proxy_set_header Host $http_host;
    }

    # The service worker and manifest must never be cached long, or a
    # deployed update can't reach a browser still holding an old one.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # index.html is the one file that names every other file: it's what
    # points a browser at this build's hashed JS/CSS chunks. Left
    # cacheable (nginx's default with no header at all), a browser can
    # silently keep serving a stale index.html after a redeploy -- it
    # then requests chunk hashes from an old build, which may 404 once
    # that build's image is gone, or (worse, and what actually happened
    # while verifying the live-update fix) silently serve a mix of old
    # and new code with no visible error at all.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are the opposite case: the filename itself
    # changes whenever the content does, so the same filename can be
    # cached forever with zero staleness risk -- this is what makes
    # index.html's no-cache above cheap rather than defeating caching
    # altogether.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
