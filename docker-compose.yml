# VERT — Versatile Eco-farming Robotic Technology
# Local-network stack: broker, databases, object storage, gateway,
# automation, inference, frontend. No component here requires internet
# access to operate -- see README.md and docs/TESTING.md.
#
# DEV-ONLY CREDENTIALS: every password in this file is a placeholder for
# local development and testing. Change every one of them (RabbitMQ
# service accounts in infra/rabbitmq/definitions.json included) before
# this ever runs anywhere reachable beyond a trusted LAN.

services:
  broker:
    image: rabbitmq:3.13-management
    hostname: vert-broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (devices)
      - "5672:5672"   # AMQP (backend services)
      - "15672:15672" # management UI -- https://localhost:15672, vert_gateway / vert_gateway_dev_password
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vert
      POSTGRES_PASSWORD: vert_dev_password
      POSTGRES_DB: vert
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vert"]
      interval: 5s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.15.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vert
      POSTGRES_PASSWORD: vert_dev_password
      POSTGRES_DB: vert_timeseries
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vert"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO's distribution keeps moving and each move has broken this
    # file: Docker Hub stopped serving minio/minio entirely on
    # 2026-09-11, then quay.io/minio/minio itself started returning 401
    # for anonymous pulls around 2026-09-28. The obvious next step,
    # quay.io/minio/aistor/minio, pulls fine but is a licensed product --
    # it starts, then refuses every S3 operation with "No valid license
    # found" until you pay for one. bitnamilegacy/minio is the one that
    # actually works unauthenticated with no license gate, confirmed
    # 2026-10-08 -- but it's an explicitly frozen, unmaintained mirror
    # (Bitnami stopped updating "legacy" images), so this is a stopgap,
    # not a destination. See SESSION_HANDOFF.md for the full trail if
    # this breaks again.
    #
    # Two real differences from the official image this replaced:
    # Bitnami's entrypoint starts the server itself from env vars (no
    # `command:` needed, and don't add one back), and it writes to
    # /bitnami/minio/data, not /data.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: vert_minio_admin
      MINIO_ROOT_PASSWORD: vert_minio_dev_password
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console -- http://localhost:9001
    healthcheck:
      # Not `mc ready local`: this image doesn't bundle the mc CLI the
      # way the official all-in-one image did. A bare TCP probe via
      # bash's /dev/tcp needs nothing extra installed in the image.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ./services/gateway
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      VERT_AMQP_URL: amqp://vert_gateway:vert_gateway_dev_password@broker:5672/
      VERT_DB_URL: postgres://vert:vert_dev_password@postgres:5432/vert?sslmode=disable
      VERT_TS_DB_URL: postgres://vert:vert_dev_password@timescaledb:5432/vert_timeseries?sslmode=disable
      VERT_JWT_SECRET: change_me_in_production
      VERT_HTTP_ADDR: ":8080"
      VERT_S3_ENDPOINT: minio:9000
      # The internal hostname above is unreachable from a browser, so
      # photo links are signed for whatever address the browser itself
      # used (localhost, the LAN IP, a phone) and served through the
      # frontend's nginx at /vert-frames/ -- see frontend/nginx.conf. Set
      # a fixed host:port here instead only if the dashboard is served
      # some other way.
      VERT_S3_PUBLIC_ENDPOINT: request
      VERT_S3_ACCESS_KEY: vert_minio_admin
      VERT_S3_SECRET_KEY: vert_minio_dev_password
      VERT_S3_BUCKET: vert-frames
      VERT_S3_USE_SSL: "false"
    ports:
      - "8080:8080"

  automation:
    build: ./services/automation
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      VERT_AMQP_URL: amqp://vert_automation:vert_automation_dev_password@broker:5672/
      VERT_DB_URL: postgres://vert:vert_dev_password@postgres:5432/vert?sslmode=disable
      VERT_JWT_SECRET: change_me_in_production
      VERT_HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"

  inference:
    build: ./services/inference
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      minio:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      VERT_AMQP_URL: amqp://vert_inference:vert_inference_dev_password@broker:5672/
      VERT_S3_ENDPOINT: minio:9000
      VERT_S3_ACCESS_KEY: vert_minio_admin
      VERT_S3_SECRET_KEY: vert_minio_dev_password
      VERT_S3_BUCKET: vert-frames
      VERT_S3_USE_SSL: "false"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - gateway
    # No API addresses to configure: the dashboard calls its APIs on its
    # own address and nginx forwards them (frontend/nginx.conf).
    ports:
      - "5173:80"

volumes:
  rabbitmq_data:
  postgres_data:
  timescale_data:
  minio_data:
