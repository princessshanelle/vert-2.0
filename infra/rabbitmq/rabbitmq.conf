# MQTT plugin: devices connect here directly, RabbitMQ maps
# MQTT topics onto the amq.topic exchange for AMQP consumers.
mqtt.listeners.tcp.default = 1883
mqtt.exchange = amq.topic
mqtt.vhost = /
mqtt.allow_anonymous = false

management.tcp.port = 15672

# Load the internal service accounts (gateway, inference, automation)
# declaratively on every boot -- see definitions.json. Devices are
# deliberately NOT in here.
management.load_definitions = /etc/rabbitmq/definitions.json

# Two-backend authentication chain: try the internal (Mnesia) user
# database first -- this is where our own backend services live -- and
# fall back to the HTTP backend for anyone it doesn't recognise, which
# is every device. This is what makes "plug in a new sensor" not require
# touching RabbitMQ configuration at all: the gateway answers for it.
auth_backends.1 = internal
auth_backends.2 = http

auth_http.user_path     = http://gateway:8080/internal/rabbitmq/auth/user
auth_http.vhost_path    = http://gateway:8080/internal/rabbitmq/auth/vhost
auth_http.resource_path = http://gateway:8080/internal/rabbitmq/auth/resource
auth_http.topic_path    = http://gateway:8080/internal/rabbitmq/auth/topic

# rabbitmq_auth_backend_http defaults to GET, but the gateway's handlers
# (services/gateway/internal/api/rabbitmq_auth.go) are written for POST
# with form-encoded params -- explicit here rather than relying on a
# version-dependent default that silently changed once already.
auth_http.http_method = post
